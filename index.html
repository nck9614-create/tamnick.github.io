<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Lexus 菁英專員隨身管家</title>
  
  <!-- Web App 手機全螢幕支援 -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0a0a0a" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel CDN (用於在瀏覽器編譯 JSX) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-neutral-950 text-neutral-100 min-h-screen font-sans select-none antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- 圖示元件 (SVG) ---
    const IconCar = () => (
      <svg className="w-5 h-5 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2">
        <path strokeLinecap="round" strokeLinejoin="round" d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.5 2.8C2 11.2 2 11.6 2 12v4c0 .6.4 1 1 1h2m14 0a2 2 0 100 4 2 2 0 000-4zm-12 0a2 2 0 100 4 2 2 0 000-4z" />
      </svg>
    );

    const IconClock = () => (
      <svg className="w-4 h-4 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2">
        <circle cx="12" cy="12" r="10" />
        <polyline points="12 6 12 12 16 14" />
      </svg>
    );

    const IconClipboard = () => (
      <svg className="w-4 h-4 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2">
        <path strokeLinecap="round" strokeLinejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
      </svg>
    );

    const IconCheck = () => (
      <svg className="w-4 h-4 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2">
        <path strokeLinecap="round" strokeLinejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
    );

    const IconPlus = () => (
      <svg className="w-4 h-4 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2">
        <path strokeLinecap="round" strokeLinejoin="round" d="M12 4v16m8-8H4" />
      </svg>
    );

    const IconTrash = () => (
      <svg className="w-4 h-4 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2">
        <path strokeLinecap="round" strokeLinejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
      </svg>
    );

    const IconEdit = () => (
      <svg className="w-4 h-4 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2">
        <path strokeLinecap="round" strokeLinejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
      </svg>
    );

    const IconX = () => (
      <svg className="w-5 h-5 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2">
        <path strokeLinecap="round" strokeLinejoin="round" d="M6 18L18 6M6 6l12 12" />
      </svg>
    );

    const IconAlert = () => (
      <svg className="w-3.5 h-3.5 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24" strokeWidth="2">
        <path strokeLinecap="round" strokeLinejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
      </svg>
    );

    // --- 主程式 APP ---
    function App() {
      const [activeTab, setActiveTab] = useState('dashboard');
      
      // 自動從 localStorage 讀取紀錄（完全不帶任何範本）
      const [tasks, setTasks] = useState(() => {
        try {
          const saved = localStorage.getItem('lexus_hub_tasks');
          return saved ? JSON.parse(saved) : [];
        } catch (e) {
          return [];
        }
      });

      // 自動同步更新至 localStorage
      useEffect(() => {
        try {
          localStorage.setItem('lexus_hub_tasks', JSON.stringify(tasks));
        } catch (e) {
          console.error('儲存失敗', e);
        }
      }, [tasks]);

      const [modalOpen, setModalOpen] = useState(false);
      const [editingId, setEditingId] = useState(null);
      const [deleteConfirmId, setDeleteConfirmId] = useState(null);

      const [formData, setFormData] = useState({
        plate: '',
        owner: '',
        model: 'RX 350',
        category: '定保',
        priority: '中',
        stage: '初步報告',
        timeSlot: '09:00',
        estimatedFinish: '',
        notes: '',
        insuranceCompany: '',
        costType: '自費'
      });

      const categories = ['定保', '鈑噴(保險)', '鈑噴(自費)', '一般維修'];
      const stages = ['初步報告', '中間關懷', '結帳交車', '已交車'];

      const handleOpenAdd = () => {
        setEditingId(null);
        setFormData({
          plate: '',
          owner: '',
          model: 'RX 350',
          category: '定保',
          priority: '中',
          stage: '初步報告',
          timeSlot: '09:00',
          estimatedFinish: '',
          notes: '',
          insuranceCompany: '',
          costType: '自費'
        });
        setModalOpen(true);
      };

      const handleOpenEdit = (task) => {
        setEditingId(task.id);
        setFormData({ ...task });
        setModalOpen(true);
      };

      const handleSave = (e) => {
        e.preventDefault();
        if (!formData.plate || !formData.owner) {
          alert('請填寫車牌與車主姓名');
          return;
        }

        if (editingId !== null) {
          setTasks(tasks.map(t => t.id === editingId ? { ...formData, id: editingId } : t));
        } else {
          const newTask = {
            ...formData,
            id: Date.now()
          };
          setTasks([newTask, ...tasks]);
        }
        setModalOpen(false);
      };

      const askDelete = (id) => {
        setDeleteConfirmId(id);
      };

      const confirmDelete = () => {
        if (deleteConfirmId !== null) {
          setTasks(tasks.filter(t => t.id !== deleteConfirmId));
          setDeleteConfirmId(null);
        }
      };

      const advanceStage = (id) => {
        setTasks(tasks.map(t => {
          if (t.id === id) {
            const currentIndex = stages.indexOf(t.stage);
            if (currentIndex < stages.length - 1) {
              return { ...t, stage: stages[currentIndex + 1] };
            }
          }
          return t;
        }));
      };

      const totalToday = tasks.length;
      const stage1Count = tasks.filter(t => t.stage === '初步報告').length;
      const stage2Count = tasks.filter(t => t.stage === '中間關懷').length;
      const stage3Count = tasks.filter(t => t.stage === '結帳交車').length;
      const finishedCount = tasks.filter(t => t.stage === '已交車').length;

      return (
        <div className="min-h-screen bg-neutral-900 text-neutral-100 flex flex-col max-w-md mx-auto shadow-2xl overflow-hidden border-x border-neutral-800 relative">
          
          {/* 頂部導覽列 */}
          <header className="bg-neutral-950 border-b border-amber-500/30 px-4 py-3 sticky top-0 z-20 flex justify-between items-center">
            <div className="flex items-center space-x-2">
              <div className="w-8 h-8 rounded-full bg-gradient-to-tr from-amber-600 to-amber-400 flex items-center justify-center font-bold text-black text-xs tracking-widest shadow">
                LX
              </div>
              <div>
                <h1 className="text-sm font-bold tracking-wider text-amber-400">LEXUS ELITE HUB</h1>
                <p className="text-[10px] text-neutral-400">專員時間管理與進度追蹤</p>
              </div>
            </div>
            <button 
              onClick={handleOpenAdd}
              className="bg-amber-500 hover:bg-amber-400 text-black px-3 py-1.5 rounded-full text-xs font-bold flex items-center shadow-lg transition-transform active:scale-95"
            >
              <IconPlus /> <span className="ml-1">新增車輛</span>
            </button>
          </header>

          {/* 數據看板 */}
          <div className="bg-gradient-to-b from-neutral-950 to-neutral-900 px-4 py-3 border-b border-neutral-800">
            <div className="grid grid-cols-4 gap-2 text-center">
              <div className="bg-neutral-900/80 p-2 rounded-xl border border-neutral-800">
                <span className="text-[10px] text-amber-400/80 block">1.初報</span>
                <span className="text-lg font-bold text-amber-400">{stage1Count}</span>
              </div>
              <div className="bg-neutral-900/80 p-2 rounded-xl border border-neutral-800">
                <span className="text-[10px] text-blue-400/80 block">2.關懷</span>
                <span className="text-lg font-bold text-blue-400">{stage2Count}</span>
              </div>
              <div className="bg-neutral-900/80 p-2 rounded-xl border border-neutral-800">
                <span className="text-[10px] text-emerald-400/80 block">3.結帳</span>
                <span className="text-lg font-bold text-emerald-400">{stage3Count}</span>
              </div>
              <div className="bg-neutral-900/80 p-2 rounded-xl border border-neutral-800">
                <span className="text-[10px] text-neutral-400 block">已交車</span>
                <span className="text-lg font-bold text-neutral-300">{finishedCount}</span>
              </div>
            </div>
          </div>

          {/* 內容區 */}
          <main className="flex-1 overflow-y-auto p-4 space-y-3 pb-24">
            <div className="flex bg-neutral-950 p-1 rounded-xl border border-neutral-800 mb-2">
              <button 
                onClick={() => setActiveTab('dashboard')} 
                className={`flex-1 py-2 text-xs font-bold rounded-lg transition-all flex items-center justify-center space-x-1 ${activeTab === 'dashboard' ? 'bg-amber-500 text-black shadow' : 'text-neutral-400 hover:text-white'}`}
              >
                <IconClock /> <span>時間排程管理</span>
              </button>
              <button 
                onClick={() => setActiveTab('list')} 
                className={`flex-1 py-2 text-xs font-bold rounded-lg transition-all flex items-center justify-center space-x-1 ${activeTab === 'list' ? 'bg-amber-500 text-black shadow' : 'text-neutral-400 hover:text-white'}`}
              >
                <IconClipboard /> <span>全車輛清單 ({totalToday})</span>
              </button>
            </div>

            {activeTab === 'dashboard' ? (
              <div className="space-y-3">
                <div className="flex justify-between items-center px-1">
                  <h2 className="text-xs font-bold uppercase tracking-wider text-neutral-400">今日時間軸與行程</h2>
                  <span className="text-xs text-amber-400">按時段排序</span>
                </div>

                {tasks.length === 0 ? (
                  <div className="text-center py-12 text-neutral-500 bg-neutral-950 rounded-2xl border border-neutral-800">
                    <div className="text-amber-500/40 mb-2">
                      <IconCar />
                    </div>
                    <p className="text-sm font-bold text-neutral-300">目前尚無車輛資料</p>
                    <p className="text-xs text-neutral-500 mt-1">點擊右上角「新增車輛」開始紀錄</p>
                  </div>
                ) : (
                  [...tasks].sort((a, b) => a.timeSlot.localeCompare(b.timeSlot)).map((task) => (
                    <div 
                      key={task.id} 
                      className={`bg-neutral-950 rounded-2xl p-4 border transition-all ${
                        task.stage === '已交車' ? 'border-neutral-800 opacity-60' : 'border-neutral-800 hover:border-amber-500/50 shadow-lg'
                      }`}
                    >
                      <div className="flex justify-between items-start mb-2">
                        <div className="flex items-center space-x-2">
                          <span className="bg-amber-500/10 text-amber-400 text-xs font-mono font-bold px-2 py-0.5 rounded border border-amber-500/20">
                            {task.timeSlot}
                          </span>
                          <span className="text-xs px-2 py-0.5 rounded bg-neutral-800 text-neutral-300">
                            {task.category}
                          </span>
                          {task.priority === '高' && (
                            <span className="text-xs px-1.5 py-0.5 rounded bg-red-500/20 text-red-400 font-bold flex items-center space-x-0.5">
                              <IconAlert /> <span>急件</span>
                            </span>
                          )}
                        </div>
                        
                        <div className="flex items-center space-x-1">
                          <button onClick={() => handleOpenEdit(task)} className="p-1.5 text-neutral-400 hover:text-amber-400">
                            <IconEdit />
                          </button>
                          <button onClick={() => askDelete(task.id)} className="p-1.5 text-neutral-400 hover:text-red-400">
                            <IconTrash />
                          </button>
                        </div>
                      </div>

                      <div className="flex justify-between items-baseline mb-2">
                        <div>
                          <h3 className="text-base font-bold text-white flex items-center">
                            {task.plate} <span className="text-xs font-normal text-neutral-400 ml-2">({task.owner} / {task.model})</span>
                          </h3>
                        </div>
                        <span className={`text-xs font-bold px-2.5 py-1 rounded-full ${
                          task.stage === '初步報告' ? 'bg-amber-500/20 text-amber-400 border border-amber-500/30' :
                          task.stage === '中間關懷' ? 'bg-blue-500/20 text-blue-400 border border-blue-500/30' :
                          task.stage === '結帳交車' ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' :
                          'bg-neutral-800 text-neutral-400'
                        }`}>
                          {task.stage}
                        </span>
                      </div>

                      {task.notes && (
                        <p className="text-xs text-neutral-400 bg-neutral-900/80 p-2.5 rounded-xl mb-3 border border-neutral-800">
                          📝 {task.notes}
                        </p>
                      )}

                      <div className="flex justify-between items-center pt-2 border-t border-neutral-900 text-xs text-neutral-400">
                        <div>預計完工: <span className="text-white font-medium">{task.estimatedFinish || '未填'}</span></div>
                        
                        {task.stage !== '已交車' ? (
                          <button 
                            onClick={() => advanceStage(task.id)}
                            className="bg-neutral-900 hover:bg-amber-500 hover:text-black text-amber-400 border border-amber-500/40 px-3 py-1.5 rounded-xl font-bold flex items-center transition-all shadow-sm active:scale-95"
                          >
                            推進階段
                          </button>
                        ) : (
                          <span className="text-emerald-400 flex items-center space-x-1"><IconCheck /> <span>服務完成</span></span>
                        )}
                      </div>
                    </div>
                  ))
                )}
              </div>
            ) : (
              <div className="space-y-3">
                <h2 className="text-xs font-bold uppercase tracking-wider text-neutral-400 px-1">全部車輛總覽</h2>
                {tasks.length === 0 ? (
                  <div className="text-center py-8 text-neutral-500">尚無任何資料</div>
                ) : (
                  tasks.map((task) => (
                    <div key={task.id} className="bg-neutral-950 rounded-xl p-3 border border-neutral-800 flex justify-between items-center">
                      <div>
                        <div className="flex items-center space-x-2">
                          <span className="font-bold text-white">{task.plate}</span>
                          <span className="text-xs text-neutral-400">{task.owner}</span>
                          <span className="text-[10px] bg-neutral-800 px-1.5 py-0.5 rounded text-amber-400">{task.category}</span>
                        </div>
                        <p className="text-xs text-neutral-500 mt-0.5">狀態：{task.stage} | 預計：{task.estimatedFinish || '未定'}</p>
                      </div>
                      <div className="flex space-x-1">
                        <button onClick={() => handleOpenEdit(task)} className="text-xs bg-neutral-900 hover:bg-neutral-800 text-amber-400 px-2.5 py-1.5 rounded-lg border border-neutral-800">
                          編輯
                        </button>
                        <button onClick={() => askDelete(task.id)} className="text-xs bg-neutral-900 hover:bg-neutral-800 text-red-400 px-2.5 py-1.5 rounded-lg border border-neutral-800">
                          刪除
                        </button>
                      </div>
                    </div>
                  ))
                )}
              </div>
            )}
          </main>

          {/* 刪除確認彈窗 */}
          {deleteConfirmId !== null && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-neutral-900 w-full max-w-xs rounded-2xl border border-neutral-800 p-5 text-center space-y-4 shadow-2xl">
                <div className="w-12 h-12 bg-red-500/10 text-red-400 rounded-full flex items-center justify-center mx-auto border border-red-500/20">
                  <IconTrash />
                </div>
                <div>
                  <h3 className="text-base font-bold text-white">確定要刪除嗎？</h3>
                  <p className="text-xs text-neutral-400 mt-1">刪除後此車輛資料將無法復原。</p>
                </div>
                <div className="flex space-x-2 pt-2">
                  <button 
                    onClick={() => setDeleteConfirmId(null)}
                    className="flex-1 bg-neutral-800 hover:bg-neutral-700 text-neutral-300 py-2.5 rounded-xl font-bold text-xs"
                  >
                    取消
                  </button>
                  <button 
                    onClick={confirmDelete}
                    className="flex-1 bg-red-500 hover:bg-red-600 text-white py-2.5 rounded-xl font-bold text-xs shadow-lg"
                  >
                    確定刪除
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* 新增/編輯 Modal 表單 */}
          {modalOpen && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
              <div className="bg-neutral-900 w-full max-w-lg rounded-t-3xl sm:rounded-2xl border border-neutral-800 p-5 space-y-4 max-h-[90vh] overflow-y-auto">
                <div className="flex justify-between items-center border-b border-neutral-800 pb-3">
                  <h3 className="text-base font-bold text-amber-400 flex items-center space-x-2">
                    <IconCar /> <span>{editingId !== null ? '編輯車輛排程' : '新增進場車輛'}</span>
                  </h3>
                  <button onClick={() => setModalOpen(false)} className="text-neutral-400 hover:text-white p-1">
                    <IconX />
                  </button>
                </div>

                <form onSubmit={handleSave} className="space-y-3">
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="text-xs text-neutral-400 block mb-1">車牌號碼 *</label>
                      <input 
                        type="text" 
                        placeholder="例如: ABC-1234"
                        value={formData.plate}
                        onChange={(e) => setFormData({ ...formData, plate: e.target.value.toUpperCase() })}
                        className="w-full bg-neutral-950 border border-neutral-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-500"
                        required
                      />
                    </div>
                    <div>
                      <label className="text-xs text-neutral-400 block mb-1">車主姓名 *</label>
                      <input 
                        type="text" 
                        placeholder="例如: 張董"
                        value={formData.owner}
                        onChange={(e) => setFormData({ ...formData, owner: e.target.value })}
                        className="w-full bg-neutral-950 border border-neutral-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-500"
                        required
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="text-xs text-neutral-400 block mb-1">車型</label>
                      <input 
                        type="text" 
                        placeholder="例如: RX 350 / ES 250"
                        value={formData.model}
                        onChange={(e) => setFormData({ ...formData, model: e.target.value })}
                        className="w-full bg-neutral-950 border border-neutral-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-500"
                      />
                    </div>
                    <div>
                      <label className="text-xs text-neutral-400 block mb-1">業務類型</label>
                      <select 
                        value={formData.category}
                        onChange={(e) => setFormData({ ...formData, category: e.target.value })}
                        className="w-full bg-neutral-950 border border-neutral-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-500"
                      >
                        {categories.map(c => <option key={c} value={c}>{c}</option>)}
                      </select>
                    </div>
                  </div>

                  <div className="grid grid-cols-3 gap-3">
                    <div>
                      <label className="text-xs text-neutral-400 block mb-1">預定時段</label>
                      <input 
                        type="time" 
                        value={formData.timeSlot}
                        onChange={(e) => setFormData({ ...formData, timeSlot: e.target.value })}
                        className="w-full bg-neutral-950 border border-neutral-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-500"
                      />
                    </div>
                    <div>
                      <label className="text-xs text-neutral-400 block mb-1">目前進度階段</label>
                      <select 
                        value={formData.stage}
                        onChange={(e) => setFormData({ ...formData, stage: e.target.value })}
                        className="w-full bg-neutral-950 border border-neutral-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-500"
                      >
                        {stages.map(s => <option key={s} value={s}>{s}</option>)}
                      </select>
                    </div>
                    <div>
                      <label className="text-xs text-neutral-400 block mb-1">優先級</label>
                      <select 
                        value={formData.priority}
                        onChange={(e) => setFormData({ ...formData, priority: e.target.value })}
                        className="w-full bg-neutral-950 border border-neutral-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-500"
                      >
                        <option value="高">高 (急件)</option>
                        <option value="中">中</option>
                        <option value="低">低</option>
                      </select>
                    </div>
                  </div>

                  {formData.category.includes('鈑噴') && (
                    <div className="grid grid-cols-2 gap-3 bg-neutral-950 p-3 rounded-xl border border-neutral-800">
                      <div>
                        <label className="text-xs text-neutral-400 block mb-1">費用性質</label>
                        <select 
                          value={formData.costType}
                          onChange={(e) => setFormData({ ...formData, costType: e.target.value })}
                          className="w-full bg-neutral-900 border border-neutral-800 rounded-lg px-2 py-1.5 text-xs text-white"
                        >
                          <option value="保險出險">保險出險</option>
                          <option value="自費">車主自費</option>
                        </select>
                      </div>
                      <div>
                        <label className="text-xs text-neutral-400 block mb-1">保險公司名稱</label>
                        <input 
                          type="text" 
                          placeholder="例如: 富邦產險"
                          value={formData.insuranceCompany}
                          onChange={(e) => setFormData({ ...formData, insuranceCompany: e.target.value })}
                          className="w-full bg-neutral-900 border border-neutral-800 rounded-lg px-2 py-1.5 text-xs text-white"
                        />
                      </div>
                    </div>
                  )}

                  <div>
                    <label className="text-xs text-neutral-400 block mb-1">預計完工時間</label>
                    <input 
                      type="text" 
                      placeholder="例如: 今日 16:00 或 明日 11:00"
                      value={formData.estimatedFinish}
                      onChange={(e) => setFormData({ ...formData, estimatedFinish: e.target.value })}
                      className="w-full bg-neutral-950 border border-neutral-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-500"
                    />
                  </div>

                  <div>
                    <label className="text-xs text-neutral-400 block mb-1">工作備註與重點</label>
                    <textarea 
                      rows="3"
                      placeholder="紀錄初步報告重點、鈑噴部位、追加項目..."
                      value={formData.notes}
                      onChange={(e) => setFormData({ ...formData, notes: e.target.value })}
                      className="w-full bg-neutral-950 border border-neutral-800 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-amber-500 resize-none"
                    ></textarea>
                  </div>

                  <div className="flex space-x-3 pt-2">
                    <button 
                      type="button" 
                      onClick={() => setModalOpen(false)}
                      className="flex-1 bg-neutral-800 hover:bg-neutral-700 text-neutral-300 py-3 rounded-xl font-bold text-sm transition-colors"
                    >
                      取消
                    </button>
                    <button 
                      type="submit" 
                      className="flex-1 bg-amber-500 hover:bg-amber-400 text-black py-3 rounded-xl font-bold text-sm transition-colors shadow-lg"
                    >
                      儲存行程
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* 底部固定欄 */}
          <footer className="bg-neutral-950 border-t border-neutral-800 py-2.5 px-4 text-center text-[10px] text-neutral-500 fixed bottom-0 max-w-md w-full z-10">
            Lexus Elite Service Hub • 資料已自動儲存至本機
          </footer>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
