<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>車輛進廠接待登記系統</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase JS SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <!-- Tesseract.js OCR Engine -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
    <!-- FontAwesome 圖示 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen pb-12">

    <!-- 頂部導覽列 -->
    <header class="bg-slate-900 text-white shadow-md sticky top-0 z-40">
        <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <i class="fa-solid fa-wrench text-amber-400 text-xl"></i>
                <h1 class="text-lg font-bold tracking-wide">車輛進廠接待系統</h1>
            </div>
            <button onclick="openRegisterModal()" class="bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold px-3 py-1.5 rounded-lg text-sm flex items-center space-x-1 shadow transition">
                <i class="fa-solid fa-plus"></i>
                <span>新增接車</span>
            </button>
        </div>
    </header>

    <!-- 主體內容 -->
    <main class="max-w-4xl mx-auto px-4 mt-6">
        
        <!-- 狀態列 -->
        <div class="bg-white rounded-xl p-4 shadow-sm border border-slate-200 mb-6 flex flex-col md:flex-row justify-between items-center gap-3">
            <div class="flex items-center space-x-2 text-sm text-slate-600">
                <span class="inline-block w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
                <span id="sync-status-text">⚡ 雲端資料庫連線中...</span>
            </div>
            <div class="flex space-x-4 text-xs font-semibold text-slate-500">
                <div>今日進廠: <span id="stat-today" class="text-slate-900 text-sm">0</span> 台</div>
                <div>未完工: <span id="stat-pending" class="text-amber-600 text-sm">0</span> 台</div>
            </div>
        </div>

        <!-- 搜尋與篩選 -->
        <div class="mb-4 flex gap-2">
            <div class="relative flex-1">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400 text-sm"></i>
                <input type="text" id="search-input" oninput="renderRecords()" placeholder="搜尋車牌、車主姓名或電話..." class="w-full pl-9 pr-4 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-slate-500">
            </div>
        </div>

        <!-- 歷史紀錄列表 -->
        <div id="records-container" class="space-y-3">
            <div class="text-center py-12 text-slate-400">
                <i class="fa-solid fa-spinner fa-spin text-2xl mb-2"></i>
                <p class="text-sm">載入資料中...</p>
            </div>
        </div>
    </main>

    <!-- 隱藏的檔案選擇器 (用於拍照/上傳車牌照片) -->
    <input type="file" id="hidden-file-input" accept="image/*" capture="environment" class="hidden" onchange="handleOCRImage(event)">

    <!-- 新增/編輯 登記 Modal -->
    <div id="register-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-2xl max-w-lg w-full max-h-[90vh] overflow-y-auto shadow-2xl flex flex-col">
            
            <!-- Modal Header -->
            <div class="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50 rounded-t-2xl sticky top-0 z-10">
                <h2 class="font-bold text-slate-800 flex items-center gap-2">
                    <i class="fa-solid fa-car-side text-slate-600"></i>
                    <span>車輛進廠接待登記</span>
                </h2>
                <button onclick="closeRegisterModal()" class="text-slate-400 hover:text-slate-600 p-1">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <!-- Modal Body -->
            <div class="p-5 space-y-4">
                
                <!-- 拍照/OCR 區塊 -->
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">📷 車牌/現場照片</label>
                    <button type="button" onclick="triggerCameraOCR()" class="w-full py-2.5 border-2 border-dashed border-slate-300 rounded-xl hover:border-slate-500 hover:bg-slate-50 transition text-slate-600 font-semibold text-sm flex items-center justify-center gap-2">
                        <i class="fa-solid fa-camera text-slate-500"></i>
                        <span>拍照辨識車牌 / 上傳照片</span>
                    </button>
                    <p id="ocr-status-text" class="text-xs text-slate-500 mt-1 text-center font-medium"></p>
                </div>

                <!-- 照片預覽區 -->
                <div id="photo-preview-group" class="hidden flex-col items-center border border-slate-200 rounded-xl p-2 bg-slate-50">
                    <img id="modal-photo-preview" src="" alt="車牌預覽" class="max-h-48 rounded-lg object-contain">
                    <button type="button" onclick="removePhoto()" class="mt-2 text-xs text-red-500 hover:underline">移除照片</button>
                </div>

                <!-- 車牌號碼輸入 -->
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">🚗 車牌號碼 <span class="text-red-500">*</span></label>
                    <input type="text" id="field-plate" placeholder="例如: BRH-3256" class="w-full p-2.5 border border-slate-300 rounded-lg text-lg font-mono font-bold tracking-wider text-slate-800 uppercase focus:ring-2 focus:ring-slate-500 outline-none">
                </div>

                <!-- 車主與聯絡資訊 -->
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">👤 車主姓名</label>
                        <input type="text" id="field-owner" placeholder="陳先生" class="w-full p-2 border border-slate-300 rounded-lg text-sm outline-none focus:ring-2 focus:ring-slate-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">📞 聯絡電話</label>
                        <input type="tel" id="field-phone" placeholder="0912345678" class="w-full p-2 border border-slate-300 rounded-lg text-sm outline-none focus:ring-2 focus:ring-slate-500">
                    </div>
                </div>

                <!-- 進廠原因/維修項目 -->
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">📝 進廠原因 / 預計維修項目</label>
                    <textarea id="field-reason" rows="3" placeholder="例如: 定期保養、煞車異音處理..." class="w-full p-2 border border-slate-300 rounded-lg text-sm outline-none focus:ring-2 focus:ring-slate-500"></textarea>
                </div>

                <!-- 狀態設定 -->
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">📌 進廠狀態</label>
                    <select id="field-status" class="w-full p-2 border border-slate-300 rounded-lg text-sm outline-none bg-white">
                        <option value="待處理">待處理</option>
                        <option value="施工中">施工中</option>
                        <option value="已完工">已完工</option>
                    </select>
                </div>
            </div>

            <!-- Modal Footer -->
            <div class="p-4 border-t border-slate-100 bg-slate-50 rounded-b-2xl flex gap-2">
                <button onclick="closeRegisterModal()" class="flex-1 py-2 rounded-lg border border-slate-300 text-slate-600 font-semibold text-sm hover:bg-slate-100 transition">取消</button>
                <button onclick="saveRecord()" class="flex-1 py-2 rounded-lg bg-slate-900 text-white font-semibold text-sm hover:bg-slate-800 shadow transition">儲存登記</button>
            </div>
        </div>
    </div>

    <!-- 腳本邏輯 -->
    <script>
        // 1. Firebase 初始化
        const firebaseConfig = {
            apiKey: "AIzaSyDOtniuCerLb8GDZVxc2DtNE3v_V0p_7O0",
            authDomain: "garage-system-1f70c.firebaseapp.com",
            databaseURL: "https://garage-system-1f70c-default-rtdb.firebaseio.com",
            projectId: "garage-system-1f70c",
            storageBucket: "garage-system-1f70c.firebasestorage.app",
            messagingSenderId: "821307567379",
            appId: "1:821307567379:web:8bf806c24f0ed59bc1bee6"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database().ref("garage_records");

        let recordsList = [];
        let currentPhotoBase64 = "";

        // 2. 即時連線 Firebase 監聽資料變化
        db.on('value', (snapshot) => {
            const data = snapshot.val();
            recordsList = [];
            if (data) {
                Object.keys(data).forEach(id => {
                    recordsList.unshift({ id, ...data[id] });
                });
            }
            updateStats();
            renderRecords();
            document.getElementById('sync-status-text').innerText = "⚡ 雲端連線成功，資料即時同步中";
        }, (err) => {
            document.getElementById('sync-status-text').innerText = "❌ 雲端連線失敗，請檢查網路狀態";
        });

        // 3. 觸發圖片上傳/拍照
        function triggerCameraOCR() {
            const input = document.getElementById('hidden-file-input');
            input.value = '';
            input.click();
        }

        // 4. 處理圖片上傳與 OCR 辨識
        async function handleOCRImage(e) {
            const file = e.target.files[0];
            if (!file) return;

            const statusText = document.getElementById('ocr-status-text');
            const previewImg = document.getElementById('modal-photo-preview');
            const plateInput = document.getElementById('field-plate');

            statusText.innerText = "⏳ 影像對比優化與 OCR 辨識中...";
            document.getElementById('photo-preview-group').classList.remove('hidden');
            document.getElementById('photo-preview-group').classList.add('flex');

            try {
                // 將圖片轉成高對比黑白圖以優化辨識效果
                currentPhotoBase64 = await processImageForOCR(file);
                previewImg.src = currentPhotoBase64;

                // Tesseract 辨識引擎
                const worker = await Tesseract.createWorker('eng');
                await worker.setParameters({
                    tessedit_char_whitelist: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789',
                });

                const res = await worker.recognize(currentPhotoBase64);
                await worker.terminate();

                // 套用台灣車牌修復規則
                const parsedPlate = cleanAndFixPlate(res.data.text);
                if (parsedPlate !== "辨識失敗") {
                    plateInput.value = parsedPlate;
                    statusText.innerText = "✅ 自動辨識成功！請核對車牌是否正確";
                } else {
                    statusText.innerText = "⚠️ 未能辨識出車牌，請直接手動輸入";
                }

            } catch (err) {
                console.error(err);
                statusText.innerText = "⚠️ 辨識發生錯誤，請直接手動輸入車牌";
            }
        }

        // 5. 圖像黑白高對比優化 (防止螺絲/點被辨識成字母)
        function processImageForOCR(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const maxSide = 800;
                        let w = img.width, h = img.height;
                        if (w > maxSide || h > maxSide) {
                            if (w > h) { h = Math.round((h * maxSide) / w); w = maxSide; }
                            else { w = Math.round((w * maxSide) / h); h = maxSide; }
                        }
                        canvas.width = w;
                        canvas.height = h;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, w, h);

                        // 二值化高對比處理
                        const imgData = ctx.getImageData(0, 0, w, h);
                        const d = imgData.data;
                        for (let i = 0; i < d.length; i += 4) {
                            let gray = 0.299 * d[i] + 0.587 * d[i+1] + 0.114 * d[i+2];
                            let v = gray < 120 ? 0 : 255;
                            d[i] = v; d[i+1] = v; d[i+2] = v;
                        }
                        ctx.putImageData(imgData, 0, 0);
                        resolve(canvas.toDataURL('image/jpeg', 0.8));
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        // 6. 台灣車牌格式修復邏輯 (修正文字誤判)
        function cleanAndFixPlate(raw) {
            let str = raw.replace(/[^A-Z0-9]/gi, '').toUpperCase();

            // 格式: 3英 + 4數 (例如 BRH3256)
            let match3_4 = str.match(/[A-Z]{3}[0-9]{4}/);
            if (match3_4) {
                let res = match3_4[0];
                return `${res.substring(0, 3)}-${res.substring(3, 7)}`;
            }

            // 格式: 2英 + 4數
            let match2_4 = str.match(/[A-Z]{2}[0-9]{4}/);
            if (match2_4) {
                let res = match2_4[0];
                return `${res.substring(0, 2)}-${res.substring(2, 6)}`;
            }

            // 格式: 4數 + 2英
            let match4_2 = str.match(/[0-9]{4}[A-Z]{2}/);
            if (match4_2) {
                let res = match4_2[0];
                return `${res.substring(0, 4)}-${res.substring(4, 6)}`;
            }

            // 通用過濾 (6~7 碼)
            if (str.length >= 6) {
                let cleanStr = str.substring(0, 7);
                if (cleanStr.length === 7) return `${cleanStr.substring(0, 3)}-${cleanStr.substring(3, 7)}`;
                if (cleanStr.length === 6) return `${cleanStr.substring(0, 3)}-${cleanStr.substring(3, 6)}`;
            }

            return "辨識失敗";
        }

        // 7. 移除照片
        function removePhoto() {
            currentPhotoBase64 = "";
            document.getElementById('modal-photo-preview').src = "";
            document.getElementById('photo-preview-group').classList.add('hidden');
            document.getElementById('photo-preview-group').classList.remove('flex');
            document.getElementById('ocr-status-text').innerText = "";
        }

        // 8. 儲存登記至 Firebase
        function saveRecord() {
            const plate = document.getElementById('field-plate').value.trim().toUpperCase();
            if (!plate) {
                alert("請輸入或辨識車牌號碼！");
                return;
            }

            const recordData = {
                plate: plate,
                owner: document.getElementById('field-owner').value.trim() || "未提供",
                phone: document.getElementById('field-phone').value.trim() || "未提供",
                reason: document.getElementById('field-reason').value.trim() || "例行檢查",
                status: document.getElementById('field-status').value,
                photo: currentPhotoBase64 || "",
                timestamp: Date.now(),
                dateStr: new Date().toLocaleDateString('zh-TW')
            };

            db.push(recordData, (err) => {
                if (err) {
                    alert("儲存失敗，請檢查網路連線");
                } else {
                    closeRegisterModal();
                }
            });
        }

        // 9. 渲染歷史列表
        function renderRecords() {
            const container = document.getElementById('records-container');
            const searchKeyword = document.getElementById('search-input').value.trim().toLowerCase();

            const filtered = recordsList.filter(item => {
                return item.plate.toLowerCase().includes(searchKeyword) ||
                       item.owner.toLowerCase().includes(searchKeyword) ||
                       item.phone.includes(searchKeyword);
            });

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="bg-white rounded-xl p-8 text-center text-slate-400 border border-slate-200">
                        <i class="fa-solid fa-folder-open text-3xl mb-2"></i>
                        <p class="text-sm">尚無相關進廠紀錄</p>
                    </div>`;
                return;
            }

            container.innerHTML = filtered.map(item => `
                <div class="bg-white rounded-xl p-4 border border-slate-200 shadow-sm flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                    <div class="flex items-start space-x-3">
                        ${item.photo ? `<img src="${item.photo}" class="w-16 h-16 rounded-lg object-cover border border-slate-200 flex-shrink-0">` : `
                            <div class="w-16 h-16 rounded-lg bg-slate-100 flex items-center justify-center text-slate-400 text-xl flex-shrink-0">
                                <i class="fa-solid fa-car"></i>
                            </div>
                        `}
                        <div>
                            <div class="flex items-center space-x-2">
                                <span class="text-lg font-mono font-bold text-slate-900">${item.plate}</span>
                                <span class="px-2 py-0.5 text-xs font-semibold rounded-full ${getStatusBadgeClass(item.status)}">${item.status}</span>
                            </div>
                            <div class="text-xs text-slate-500 mt-1 flex flex-wrap gap-x-3 gap-y-1">
                                <span><i class="fa-solid fa-user"></i> ${item.owner}</span>
                                <span><i class="fa-solid fa-phone"></i> ${item.phone}</span>
                                <span><i class="fa-regular fa-clock"></i> ${new Date(item.timestamp).toLocaleString('zh-TW')}</span>
                            </div>
                            <p class="text-xs text-slate-700 mt-2 bg-slate-50 p-2 rounded border border-slate-100">${item.reason}</p>
                        </div>
                    </div>
                    <div class="flex gap-2 w-full md:w-auto justify-end">
                        <button onclick="deleteRecord('${item.id}')" class="px-3 py-1.5 border border-red-200 text-red-600 rounded-lg text-xs font-semibold hover:bg-red-50">刪除</button>
                    </div>
                </div>
            `).join('');
        }

        // 10. 刪除紀錄
        function deleteRecord(id) {
            if (confirm("確定要刪除這筆紀錄嗎？")) {
                db.child(id).remove();
            }
        }

        // 11. 更新上方統計數據
        function updateStats() {
            const todayStr = new Date().toLocaleDateString('zh-TW');
            const todayCount = recordsList.filter(r => r.dateStr === todayStr).length;
            const pendingCount = recordsList.filter(r => r.status !== '已完工').length;

            document.getElementById('stat-today').innerText = todayCount;
            document.getElementById('stat-pending').innerText = pendingCount;
        }

        // 12. 狀態顏色輔助函式
        function getStatusBadgeClass(status) {
            switch(status) {
                case '已完工': return 'bg-emerald-100 text-emerald-700';
                case '施工中': return 'bg-amber-100 text-amber-700';
                default: return 'bg-slate-100 text-slate-600';
            }
        }

        // Modal 控制邏輯
        function openRegisterModal() {
            removePhoto();
            document.getElementById('field-plate').value = "";
            document.getElementById('field-owner').value = "";
            document.getElementById('field-phone').value = "";
            document.getElementById('field-reason').value = "";
            document.getElementById('field-status').value = "待處理";
            document.getElementById('register-modal').classList.remove('hidden');
        }

        function closeRegisterModal() {
            document.getElementById('register-modal').classList.add('hidden');
        }
    </script>
</body>
</html>
